evse_led_register_smoke:
  stage: hil

  tags:
    - rpi-shell
    - hil
    - bench-01
    - stm32f429
    - stlink

  resource_group: bench-01
  interruptible: false

  manual_confirmation: "NUCLEO-F429ZI LD1(PB0)을 OpenOCD로 3회 ON/OFF 합니다. CN1/ST-LINK 연결과 외부 배선을 확인했습니까?"

  variables:
    OPENOCD_BOARD_CFG: "board/st_nucleo_f4.cfg"
    OPENOCD_ADAPTER_KHZ: "1000"

  before_script:
    - echo "runner=${CI_RUNNER_DESCRIPTION}"
    - echo "host=$(hostname)"
    - id
    - openocd --version
    - python3 --version
    - mkdir -p reports logs
    - |
      echo "=== ST-LINK USB preflight ==="
      lsusb | tee logs/lsusb.txt
      if ! grep -qi '0483:' logs/lsusb.txt; then
        echo "ERROR: STMicroelectronics USB device (VID 0483) not found."
        exit 1
      fi
    - |
      echo "=== OpenOCD connection preflight ==="
      openocd         -f board/st_nucleo_f4.cfg         -c "adapter speed 1000; init; reset halt; shutdown"         2>&1 | tee logs/openocd-preflight.log

  script:
    - |
      set -o pipefail
      python3 -m pytest         -v         -s         tests/hil/evse/test_evse_led_register_smoke.py         --junitxml=reports/evse-ld1-smoke.xml         2>&1 | tee logs/evse-ld1-smoke.log

  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit:
        - reports/evse-ld1-smoke.xml
    paths:
      - reports/
      - logs/

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never